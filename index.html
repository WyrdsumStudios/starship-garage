"\u{1FAD9}"},trophy:{name:"Pip & Pop's Racing Trophy",icon:"\u{1F3C6}"},portrait:{name:"The Duchess's Portrait",icon:"\u{1F451}"},bobble:{name:"Bzzt-9 Bobblehead",icon:"\u{1F916}"},wrench:{name:"Krill's Golden Wrench",icon:"\u{1F527}"}},Hr=50,Uh=["Glorp","Mrs. Venn","Big Terry","Admiral Fluffington","Kex the Smuggler","Dr. Ooblek","Princess Nebula","Grumbo","Tiny Vex","Skip Starling","Moxie Quasar","Lady Comet","Two-Hats Morgan","Sergeant Squish","Nova Delacroix","Mister Bleep","Auntie Orbit","Captain Crumb","Zib & Zab","Professor Wobble","Rhoda Rocketfeller","Gus the Goo","Ensign Tuesday","Madame Meteor"],Wh={shuttle:["Rustbucket II","Moonhopper","Space Taxi 7","Galaxy Minivan","The Sassy Pigeon","Little Blip","Commuter 3000"],freighter:["Cosmic Clunker","Orbit Wagon XL","The Heavy Sigh","Big Bertha","Cargo Cult","The Slow Burn"],racer:["Wobbly Comet","Red Shift","Nebula Noodle","Zoom Zoom Zero","The Blur","Sonic Biscuit"],yacht:["Stardust Deluxe","The Velvet Ego","Champagne Supernova","Golden Goose","The Marquee"],exotic:["The Singing Shell","Crystal Whisper","Bio-Ship 'Squelch'","The Clockwork Moth","Void Lantern"],legendary:["The Lynx Comet","Eternity's Edge","The First Light","Dragon of Andromeda"]},Qh=["Burnt-out Freighter","Crunched Shuttle","Retired Taxi","Pirate Skiff (no questions)","Mystery Hulk","Grandma's Cruiser","Cracked Mining Barge","Flooded Yacht","Melted Ice-cream Van","Decommissioned Drone Hive","Scorched Mail Ship"],Kh=[`"Hurry up, trash panda. I haven't got all cycle."`,'"Is this a garage or a petting zoo?"','"My last mechanic was a REAL professional."',`"Don't get fur on my seats, rodent."`,`"I could fix it myself, I'm just busy."`,'"Why does it smell like wet raccoon in here?"','"Do you take coupons? I have seven."',`"I'll be timing you. Out loud."`,'"Last place charged half. Also it exploded, but still."'],Vh=[`"Hi! It makes a noise like 'ka-plunk'. Is ka-plunk bad?"`,`"Heard you're the best in the sector!"`,'"Take your time, I brought a book."','"My kid drew a picture of your raccoon. Is that weird?"',`"It was fine until it wasn't, you know?"`,'"I hit a space goose. Long story."',`"Something in the back goes 'wheee'. Constantly."`,`"Please be gentle, she's my baby."`,'"Is that a lynx plushie? Adorable."','"Do you two run this place? Cute."',`"I tried duct tape. In space. Didn't hold."`,'"My nav computer keeps routing me to a taco stand."'],Wd={storm:{name:"Solar Storm",icon:"\u2600\uFE0F",desc:"Charged particles everywhere. Ships come in with extra damage, but storm repairs pay 25% more.",lvl:1},rush:{name:"Rush Hour",icon:"\u{1F6A6}",desc:"The hyperlane's jammed. Three extra customers are coming, and everyone's a little impatient.",lvl:1},sale:{name:"Junkyard Clearance",icon:"\u{1F3F7}\uFE0F",desc:"The junkyard is clearing space. Junkers are half price today, plus one extra.",lvl:1},festival:{name:"Comet Festival",icon:"\u{1F386}",desc:"Everyone's in a good mood. Tips are doubled today.",lvl:1},boom:{name:"Parts Shortage",icon:"\u{1F4C8}",desc:"Parts prices are up 35% today. Great day to sell, bad day to buy.",lvl:2},crash:{name:"Parts Glut",icon:"\u{1F4C9}",desc:"The market's flooded. Parts are 30% cheaper today. Stock up!",lvl:2},inspection:{name:"Safety Inspection",icon:"\u{1F9D0}",desc:"Inspector Pell is watching. Finish the day with nobody walking out for a bonus, or pay a fine.",lvl:2},pirate:{name:"A Shady Offer",icon:"\u{1F3F4}\u200D\u2620\uFE0F",desc:"Captain Smirk wants a 'no questions asked' engine swap on a very hot ship. 180\xA2 cash now, but word gets around (-4 reputation, and inspectors get curious).",lvl:2}},Yh=["storm","rush","sale","festival","boom","crash","inspection","pirate"],hi=[{id:"first",name:"Grease Monkey",icon:"\u{1F527}",desc:"Fix your first ship"},{id:"ten",name:"Regular Business",icon:"\u{1F9FE}",desc:"Fix 10 ships"},{id:"fifty",name:"Fifty Shades of Grease",icon:"\u{1F6E2}\uFE0F",desc:"Fix 50 ships"},{id:"hundredfifty",name:"Galactic Institution",icon:"\u{1F3DB}\uFE0F",desc:"Fix 150 ships"},{id:"exotic",name:"Weird Science",icon:"\u{1F991}",desc:"Fix an exotic ship"},{id:"legend",name:"The Stuff of Legends",icon:"\u{1F31F}",desc:"Fix a legendary ship"},{id:"perfect",name:"Nobody Walked",icon:"\u{1F607}",desc:"A day with 4+ repairs and zero walkouts"},{id:"rich",name:"Money Boss",icon:"\u{1F4B0}",desc:"Hold 1000\xA2 at once"},{id:"mogul",name:"Space Mogul",icon:"\u{1F911}",desc:"Earn 5000\xA2 in repairs over all time"},{id:"heart",name:"Best Friends",icon:"\u{1F496}",desc:"Max out hearts with a regular"},{id:"family",name:"Found Family",icon:"\u{1F3E1}",desc:"Finish every regular's story"},{id:"shady",name:"Shady Business",icon:"\u{1F3F4}\u200D\u2620\uFE0F",desc:"Take a pirate job"},{id:"honest",name:"Squeaky Clean",icon:"\u{1F9FC}",desc:"Refuse the pirates 3 times"},{id:"week",name:"Week Warrior",icon:"\u{1F4C5}",desc:"Hit a weekly goal"},{id:"decor",name:"Interior Designer",icon:"\u{1F6CB}\uFE0F",desc:"Own 5 decorations"},{id:"lvl5",name:"Legendary Garage",icon:"\u{1F3C6}",desc:"Reach garage level 5"},{id:"scrapper",name:"Scrap Lord",icon:"\u267B\uFE0F",desc:"Tear down 25 junkers"},{id:"premium",name:"Only the Best",icon:"\u2728",desc:"Install 25 premium parts"},{id:"contracts",name:"Contractor",icon:"\u{1F4CB}",desc:"Complete 10 contracts"},{id:"day30",name:"Lifer",icon:"\u{1F5D3}\uFE0F",desc:"Reach day 30"},{id:"dream",name:"Dream Ship",icon:"\u{1F680}",desc:"Finish building the Lynx Comet"}],jr={open:["Lights on, coffee's on, lynx. Let's make some credits.","*cracks knuckles* Bring me something broken.","Another day, another busted hyperdrive. I love this job.","You run the money, I'll run the floor. Perfect partnership, lynx.","*leans on the toolbox* Open for business, sweetheart.","Shop's open. Try not to stare at my biceps, it slows the work down.","Morning, boss. I already broke two things and fixed three. Net positive.","Flip the sign, lynx. Let's go get rich-ish.","*rolls out on the creeper* Who's ready to get greasy? Me. I'm always ready.","New day, same gorgeous mechanic. Lucky you.","I had a dream we fixed a ship made of cheese. Anyway. Open up.","*wipes paws on a rag* Okay. Let's make this place smell like money."],customer:["Ooh, a customer. Put on your money face, lynx.","Look at that ship. Somebody's been parking by feel.","Incoming! Quote 'em something fair... or don't. Your call, boss.","*wipes paws on a rag* Let's see what we're working with.","Smells like a fried coil from here. Easy credits.","New ride in the bay. I'll be gentle with it. Mostly.","Another one? We're popular. It's the raccoon charm.","Hear that rattle? That's the sound of rent getting paid.","*squints at the hull* Yeah, I can fix that. I can fix anything. Except my sleep schedule.","Customer! Act natural. I'll act handsome.","Ugh, who taught these people to fly? Don't answer, more business for us.","That ship's held together with hope and gum. My favorite kind."],arrive_freighter:["A freighter. Big, slow, and full of complaints. I love 'em.","Hauler's in. They're patient, at least. Unlike me.","Freighter pilots always tip in snacks. Hope this one tips in credits."],arrive_racer:["A racer! Fast ship, faster temper. Work quick, lynx.","Oh, she's pretty. And impatient. Move it, boss.","Racers pay big, but they tap their feet the whole time. Chop chop."],arrive_yacht:["A yacht. Fancy. No scrap parts on this one, they'll notice.","Ooh, rich people. Standard parts or better, and I'll pinky out while I work.","Yacht's in. Put on your posh voice, lynx. 'Mahvelous'."],arrive_exotic:["Whoa. Is that ship... humming at me? Exotic job, big money.","Never seen one of these outside a holo-documentary. Let me at it.","Exotic ship! I'm gonna be very careful and very smug about this."],arrive_legendary:["Lynx. LYNX. That's a legendary ship. Premium parts pay extra on this one. Don't breathe on it.","*drops wrench* That's... that's THE ship. We're famous now. Don't mess this up. I mean me. Don't let ME mess this up.","A legend in our garage. Premium parts, best work. Let's make history, sweetheart."],rude:["Wow. Rude. I'm charging extra for the attitude, lynx.","*smiles sweetly* I'm gonna tighten everything juuust a little crooked.","Did that walking tax return just call me a rodent?","Go ahead, gouge 'em. I won't tell.","Lynx, hold my wrench before I do something I regret.","Oh, a charmer. Let's charge 'em Premium and smile real big.","I've been insulted by better. Mostly by my reflection, before coffee.","*whispers* Can we put a whoopee cushion in their pilot seat?","That one's getting the 'special' service. Which is the normal service, but I'll glare."],quote:["Price set. You're scary when you do math. I like it.","Ka-ching. Nice negotiating, lynx.","That's my business partner. Ruthless and adorable.","Fair price, fair work. Look at us being respectable.","You quote, I wrench. Dream team."],friendly:["Friendly price? You softie. They'll be back though.","Aww, a discount. You're too nice, lynx. That's why I keep you around.","Discount and a smile. Good for the reputation, bad for my beer fund.","You're gonna make them fall in love with this place. Like I... uh. Like I love wrenches."],premium:["Premium pricing! You're my favorite kind of dangerous.","Bold. I respect it. Let's earn that markup.","Premium? Then I'd better do premium work. And premium posing.","Look at you, squeezing credits like a pro. Proud of you."],buy:["Fresh junk! My favorite smell. Rust and opportunity.","You bought a pile of scrap for me? Lynx, you shouldn't have.","Into the rig it goes. Gonna strip it like a holiday turkey.","Ooh, look at all those rattles. Treasure in there somewhere.","That junker's got secrets. And probably a family of space mice.","Dibs on anything shiny.","I'll have that thing in pieces before you can say 'warranty void'."],scrapDone:["*wipes grease off his paws* Teardown done. Look what I found.","Pulled the good stuff. The rest is a really ugly planter now.","Scrapped! Honestly I could do this in my sleep. I have, actually.","Done. Found a sandwich in there too. Not sharing.","Another junker reduced to beautiful parts. Art, really.","Teardown complete. Also I found a sock. Why is there always a sock?","*blows on a smoking bolt* Easy.","Stripped it clean. That ship's in a better place now. Our shelves.","Parts! Sort 'em, sell 'em, bolt 'em. You're the boss."],install:["*clunk* That one's going in.","Click, whirr, perfect. Don't clap, it's embarrassing. Okay, clap a little.","Bolted in. Tighter than your League rank anxiety, lynx.","Installed. I barely even swore that time.","One down. *twirls wrench, almost drops it, plays it cool*","In it goes. Like it was born there.","That's a snug fit. Nice."],installScrap:["Scrap part? It'll hold. Probably. They'll pay a little less, though.","Using the cheap stuff. It's... character. Rustic.","That part's seen things. Bad things. It'll still work."],installPremium:["Premium part in. Smell that? That's quality. And ozone.","Ooh, the good stuff. They'll feel the difference.","Premium install. I'm basically an artist."],done:["Fixed! Purrs like a kitten. A big, angry, rocket-powered kitten.","Another happy customer. Count the credits, lynx, I'll pose.","Done and done. Better than factory, and I'm only a little smug about it.","Keys handed over. Tip jar's thataway, folks.","*leans on the toolbox* Yeah. I'm that good.","She flies! Mostly upward. That's the right way.","Another one off the lift. Somebody write a song about me.","*wipes paws, slow and dramatic* Next.","Good as new. Better, actually, 'cause I touched it.","And that's how a professional does it, lynx. Take notes. Or photos."],done_racer:["Racer's fixed. Go win something, kid. Tell 'em Rocket sent you.","That racer'll do zero to ludicrous in four seconds now. You're welcome."],done_yacht:["Yacht's done. I left a tiny fingerprint on the chrome. Signature move.","The rich folks are happy. Quick, lynx, invoice before they sober up."],done_exotic:["Exotic ship, fixed. I'm putting this on my r\xE9sum\xE9.","It hummed a little thank-you song when we finished. I'm not crying, it's engine fumes.","Fixed a ship I don't fully understand. Peak mechanic energy."],done_legendary:["We fixed a LEGEND, lynx. A legend! *high fives the air, then you*","History books are gonna mention us. Small font. Still counts."],walk:["They walked?! Rude. Their engine's gonna miss me.","Lost one. Let's be faster next time, lynx... I mean me. I mean us.","There they go. Patience of a hamster on espresso.","Aaand they're gone. More coffee for us.","Ouch. That one'll leave a review. Probably in all caps.","They left. It's fine. I'm fine. *kicks a tire gently*"],broke:["Uh, lynx? The credit jar's echoing.","We're running on fumes, sweetheart. Maybe sell a kidney? Kidding. Mostly.","Money's tight. Buy cheap junkers and we'll squeeze 'em dry.","Broke again. Good thing we're both charming.","Try selling some spare parts in the market, boss. Desperate times."],rich:["Look at that balance. Should we buy a second toolbox? For me to lean on?","We're loaded, lynx. Treat yourself. Treat ME. A decoration, maybe?","Big money. I'm gonna start wearing a tie. Kidding. Maybe a bow tie."],idle:["*leans on the toolbox, very casually, definitely posing*","I'm just gonna stand here looking rugged until you click something.","Hey lynx. Ships don't fix themselves. Well, they do if I'm doing it, but you gotta click.","*twirls a wrench* So... come here often?","Did you hydrate today? Drink some water, then make money.","I could be napping, you know. I choose to be here. For you.","*hums an old Terran rock song badly*","You okay over there, boss? You've got your thinking face on.","*tosses a bolt in the air, catches it* Still got it.","Fun fact: raccoons have 5 fingers. I use all of them for wrenching. And one for pointing at you.","Psst. The market's got prices today. Just saying.","*inspects his reflection in a hubcap* Yep. Still handsome.","If you're bored, the junkyard's full of treasure. And tetanus.","I'm counting ceiling tiles. 47. There's a raccoon-shaped stain on 23. Not me. Probably me.","Remember to stretch, lynx. Shoulders down. There you go.","This shop's pretty great, huh? Don't tell anyone I'm sentimental."],morning:["*yawns* Too early for customers. Not too early for coffee.","Morning shift. I'm awake. Mostly. My tail's still asleep.","Early bird gets the busted thrusters."],evening:["Almost closing time. Let's finish strong, lynx.","Sun's setting over the hangar. Pretty. Like the ledger's gonna be.","Last stretch of the day. I can smell dinner. Or a coolant leak.","Clock's ticking, boss. Close up early if you're done."],noPart:["We don't have that part. Junkyard or the market, boss.","I'm good, but I can't fix a nav computer with a spoon.","Shelf's empty for that one. Buy a junker or hit the market.","That needs a better part than we've got. Yachts are picky."],upgrade:["New toys! Oh, you spoil me, lynx.","Look at this beauty. I might cry. I won't. But I might.","Upgrade installed. The shop's getting classy. Too classy? Nah.","*hugs the new equipment* I'm naming it after you. Nope, after me.","You keep buying me stuff and I'll keep fixing stuff. Fair trade."],ledger:["Your turn, money boss. Tell me we're rich.","Count it up, lynx. I'll sit here and look tired and handsome.","*flops on the creeper* Long day. Good day, though.","How'd we do? Don't sugarcoat it. Actually, sugarcoat it a little.","Closing time. Pass me the books. Kidding, you're better at math. And everything."],loan:["Here, from my secret swear jar. Don't ask how it got so full.","Fine, a loan from the swear jar. Interest is one compliment.","Swear jar to the rescue. I'm a very sweary raccoon, lucky you."],dealer:["Brand new part? Fancy. We're paying sticker price though, boss.","Factory fresh. Smells like a showroom and regret.","Ooh, shiny new parts. I'll try not to lick them.","New part bought. Wallet's crying, ship's happy."],sell:["Sold! One raccoon's junk is another sucker's treasure.","Cha-ching. Spare parts into spare credits.","You're a natural trader, lynx. Scary natural.","Sold that one. I'll miss it. Not really."],lobby:["Bays are full, lynx. Park 'em in the lobby, I'll get to 'em.","Another one? Lobby's filling up. We're famous, sweetheart.","*points wrench at the lobby* Have a seat, grab a magazine, don't touch my stuff.","Full house! Somebody tell the lobby I'm worth the wait.","Lobby's getting crowded. Maybe we need another bay, boss."],lobbyLeft:["Lobby's packed, so that one just flew off. We need more bays, lynx.","Turned one away at the door. No room! Upgrade time, boss?","No room at the inn. Or the garage. They left."],contract:["Contract done! The board loves us.","Paperwork AND credits. Look at us being a real business.","Contract complete. I'm basically a corporation now.","Bounty claimed. Nice hustle, lynx."],levelUp:["The garage leveled up! New stuff unlocked, lynx. Look at us grow.","Promotion! We're moving up in the galaxy. Still the same greasy floor though.","Garage level up! *pops a tiny confetti cannon* I keep one for occasions.","New garage rank. People are gonna start saying our name in hushed tones."],achievement:["Achievement unlocked! Put it on the wall next to my good side.","Ooh, a shiny achievement. I'm framing that.","We got an achievement, lynx! *does a tiny victory dance*"],week:["Weekly goal smashed! You're the best boss in the sector, lynx.","Week's done and we crushed it. Bonus credits! *fist bump*"],weekMiss:["Missed the weekly goal. Next week, we go harder. Or smarter. Probably smarter."],ev_storm:["Solar storm today. Ships are gonna come in crispy. Extra pay, though.","Storm's crackling. My fur's all static. Don't touch me. Okay, you can touch me, just don't get zapped."],ev_rush:["Rush hour! Lots of ships, short tempers. Let's move fast.","Hyperlane's jammed. Money's gonna pour in, lynx. Brace yourself."],ev_sale:["Junkyard clearance! Cheap junk. My heart's racing.","Half-price junkers. Buy 'em all. Okay, not all. Most."],ev_festival:["Comet festival! Everyone's tipping big. Smile pretty, lynx.","Fireworks tonight! And tips all day. Best holiday."],ev_boom:["Parts shortage. Sell spares today, don't buy unless you have to.","Prices are up. If we've got extra parts, now's the time to dump 'em."],ev_crash:["Parts glut! Stock up the shelves, boss, it's a buffet.","Parts are cheap today. Fill the shelves. I'll organize them. By vibes."],ev_inspection:["Inspector Pell's here. Act professional. *hides the whoopee cushion*","Inspection day. Nobody walks out, okay? I'll even wear the clean jumpsuit."],ev_pirate_yes:["Took the shady job, huh? *whistles innocently* I didn't see anything.","Fast credits. Just don't tell your dad. Or the inspector.","Smirk paid in cash and a weird amount of glitter. Classic pirate."],ev_pirate_no:["Turned down a pirate! My honest little lynx. I'm weirdly proud.","Good call. Smirk's ships are always on fire. Literally.","No shady jobs. Our reputation stays shiny. Like my smile."],inspPass:["Inspection passed! Pell almost smiled. Almost.","Clean record! I'm getting a gold star sticker. I'm buying it myself."],inspFail:["Inspection fine. Pell wrote a LOT. Like, a novel."],regulars:["A regular! Our little family's growing.","Oh hey, I know that ship. Welcome back!","Regulars are the best. They already know I'm amazing."]},js={fern:["Gerald's looking leafy today. Good job, Gerald.","I talk to Gerald when you're not around. He's a good listener.","*waters Gerald with coffee* He likes it. I think."],radio:["*the radio crackles* Ooh, I love this song! *sings off-key*","Radio says it's sunny on Mars. It's always sunny on Mars. Liars.","*air guitars with a wrench* You didn't see that."],mug:["Your mug says 'World's Best Boss'. Accurate. I checked.","I put coffee in your mug. Don't get used to it. Okay, get used to it."],lights:["The string lights make this place feel cozy. Like a cabin. With engines.","*admires the lights* Okay, you have great taste, lynx."],plush:["The lynx plushie is watching me work. It's very supportive.","Don't tell anyone, but I patted the plushie for luck. Twice.","That plushie looks a lot like someone I know. Cute. The plushie. And... yeah."],arcade:["New high score on Asteroid Smasher! ROCKET. Again. Obviously.","Wanna play Asteroid Smasher after closing? I'll let you win. I won't."],calendar:["Mr. October's looking good today. *wink*","The calendar was your idea. I'm just saying. You bought it."],neon:["The neon sign buzzes 'ROCKET'S'. I stare at it sometimes. It's my name, in lights!","Pink neon. Classy. Like me."],disco:["*the disco ball spins* Every repair is a party now.","Disco ball's going. I'm wrenching to the beat."],hammock:["I'm not napping, I'm inspecting the hammock's structural integrity.","Hammock's calling my name. Five more ships, then hammock."]},Ad=["You know, I used to work alone. This is better.","Your dad would like this place, I think. Good hoist, good tools.","*wipes paws* Hey. You're doing great, lynx. Really.","I saved you the good stool. The one that doesn't wobble.","Sometimes I forget to be sarcastic around you. It's weird. I like it.","*hums your favorite song, badly, on purpose*","If this garage is a ship, you're the nav computer. I'm the engine. Loud and handsome.","Thanks for sticking with me, sweetheart. Don't make it a thing.","I wrote your name on my toolbox. Small. Inside the lid. Don't look.","Best business partner in the galaxy. I'll fight anyone who disagrees."],an=[{id:"zorla",name:"Captain Zorla",ship:"The Gravy Boat",cls:"freighter",hue:30,lvl:1,rudeUntil:0,gift:"jam",says:[`"Name's Zorla. Thirty years hauling cargo. This old girl's tired, and so am I."`,'"Back again! Been thinking about retiring. Maybe a little moon farm."','"Saw a farm listing on Luna-7. Tomatoes. Imagine me, growing tomatoes!"','"Last haul next week. Then the farm. Gonna miss you two."','"Final run, kids. I made you something."'],rocket:["Zorla's a sweetheart. Grumpy sweetheart. My favorite kind.","A moon farm? Zorla in overalls? I need to see that.","She's really doing it, lynx. Space tomatoes.","I'm not sad, you're sad. Okay, a little sad.","She left us jam from her first harvest. I'm putting it on the shelf of honor. \u{1FAD9}"]},{id:"bzzt",name:"Bzzt-9",ship:"Orbit Wagon",cls:"shuttle",hue:190,lvl:1,rudeUntil:0,gift:"bobble",says:[`"GREETINGS. I AM BZZT-9, COURIER. I HAVE BEEN TOLD I AM 'NOT FUN'."`,'"I HAVE PREPARED A JOKE. WHY DID THE ROBOT CROSS THE ROAD? IT WAS PROGRAMMED TO."','"I TOLD YOUR JOKE TO A TOASTER. IT DID NOT LAUGH. IT IS A TOASTER."','"I HAVE MADE A FRIEND. HER NAME IS DISHWASHER. WE DISCUSS SOAP."','"YOU TWO ARE MY BEST FRIENDS. THIS IS A FACT. I HAVE CHECKED."'],rocket:["That robot's adorable. Don't tell it I said that, it'll log it.","Bzzt-9, I'll teach you real jokes. Knock knock. ...It's still processing.","A toaster. Classic tough crowd.","Our little robot's making friends! I'm a proud weird uncle.","Bzzt-9 gave us a bobblehead of itself. It nods at me. I nod back. \u{1F916}"]},{id:"pip",name:"Pip & Pop",ship:"Lil' Meteor",cls:"racer",hue:320,lvl:2,rudeUntil:0,gift:"trophy",says:[`"We're Pip and Pop! Twin racers! We're gonna win the Nebula Cup!"`,'"We came in 12th! Out of 12! But we FINISHED!"',`"Sixth place! Six is a great number! It's like half of twelve!"`,'"Finals tomorrow! Make her fast, Mister Rocket!"',`"WE WON! WE WON THE NEBULA CUP! This trophy's for you!"`],rocket:["Twin racers with zero chill. I love these kids.","Last place, but they finished! That's the spirit.","Sixth! They're getting better. I'm tuning that engine with love.","Okay, I gave Lil' Meteor a secret turbo. Don't tell the officials.","They won, lynx! Our kids won! *sniff* The trophy's going on the shelf. \u{1F3C6}"]},{id:"duchess",name:"The Duchess of Pluto",ship:"The Velvet Thunder",cls:"yacht",hue:270,lvl:3,rudeUntil:2,gift:"portrait",says:['"Ugh. A raccoon. Well, I suppose the GOOD garages were busy."',`"You again. Fine. Your work was... adequate. Don't let it go to your head."`,`"I told my friends about this place. I said it was 'acceptable'. That's high praise."`,`"Between us, Pluto's lonely. People think I'm a snob. I'm just... shy."`,'"You two are the only ones who never bowed. I adore that. Here, a gift."'],rocket:["The Duchess called me a raccoon. Which. Okay, fair. But RUDELY.","'Adequate'! From her, that's basically a hug.","We're 'acceptable'! Put it on the sign!","Huh. She's lonely. Now I feel bad about the whoopee cushion plan.","She gave us her portrait. It's enormous. It stares. I love it. \u{1F451}"]},{id:"krill",name:"Old Man Krill",ship:"The Barnacle",cls:"exotic",hue:150,lvl:4,rudeUntil:0,gift:"wrench",says:['"Well, well. Little Rocket, running his own shop. I taught you to hold a wrench, kid."','"Still crooked on the third bolt. Some things never change, eh?"',`"You've got a good partner there. Better than I ever had. Don't mess it up."`,`"My hands shake now. Can't fix the Barnacle myself anymore. Glad it's you."`,`"Here. My golden wrench. It's yours now, kid. You earned it."`],rocket:["Krill was my first boss. He taught me everything. Including how to swear in nine languages.","The third bolt is FINE, old man. *re-tightens the third bolt*","He likes you, lynx. He never likes anybody.","*quiet* He's getting old. I'll take care of the Barnacle. Always.","Krill's golden wrench. I'm... gonna need a minute, lynx. \u{1F527}"]}],Un=[{name:"Salvaged Keel",cost:1500,desc:"A keel pulled from the best wreck in the yard.",line:"The keel's down, lynx. Our ship has a spine! It's... beautiful. Shut up, it is."},{name:"Fusion Heart",cost:3e3,desc:"A hand-built fusion core. Hums like a happy cat.",line:"*listens to the core hum* Hear that? That's a heartbeat. Our ship's alive."},{name:"Starlight Hull",cost:5e3,desc:"Polished plating that glows faintly orange under work lights.",line:"Hull's on. Orange glow, blue trim. I picked the colors. They're our colors."},{name:"Nebula Sails",cost:7500,desc:"Solar sails that unfold like wings.",line:"The sails opened and I just stared for ten minutes. You saw. Don't tell anyone."},{name:"First Flight",cost:1e4,desc:"Fuel, paint, a name on the side: THE LYNX COMET.",line:"She's done. The Lynx Comet. Named after my favorite person. Wanna take her for a spin, sweetheart?"}],Gh=`The hangar doors roll open and the Lynx Comet lifts off with you in the co-pilot seat. Rocket loops her once around the moon, just to show off. "Built her with you, flew her with you," he says, boots up on the dash. "Best project I ever had, lynx. And I don't mean the ship."`,un=[{day:2,title:"The Second Night",text:`After closing, Rocket sits on the toolbox and offers you half a crumpled sandwich. "Not bad for a first week, lynx. You do the money, I do the wrenching. I think we've got something here." He doesn't make eye contact. His ears are a little pink.`},{day:4,title:"The Good Stool",text:`You find the wobbly stool replaced with a new one, painted orange, with a lynx doodle on the seat. "Found it in a junker," Rocket says, way too fast. "Totally didn't spend two hours on it. Shut up. Sit down."`},{day:6,title:"Grease Smudge",text:`Rocket wipes a smudge of grease off your cheek with his thumb, then freezes. "You had... a thing. It's gone. Uh. Back to work." He walks straight into a wall of tires. "MEANT to do that."`},{day:8,title:"The Radio Song",text:`A song comes on the shop radio and Rocket goes quiet. "My old crew used to play this. Before... well. Before I was solo." He turns it up. "It's a better song with you here. Don't make it weird."`},{day:11,title:"Shop Talk",text:`Over noodles, you tell Rocket about garage days with your dad. He listens, chin on his paw. "That's the stuff, lynx. Somebody passing you a wrench and not needing to say anything." He slides you a 10mm socket. "Here. Now we've got a tradition."`},{day:14,title:"Two Weeks",text:`Rocket hangs a sign over the register: 'HAYLEY
